name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Android project
        run: |
          P=app/src/main
          J=$P/java/com/apkimg/editor
          rm -rf app
          mkdir -p $J $P/assets
          keytool -J-Dkeystore.pkcs12.legacy -genkeypair -keystore $P/assets/sign.p12 -storetype PKCS12 -alias mod \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass apkimg123 -keypass apkimg123 -dname "CN=APK Image Editor"
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ApkImageEditor"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.apkimg.editor'
            compileSdk 34
            defaultConfig {
              applicationId 'com.apkimg.editor'
              minSdk 29
              targetSdk 34
              versionCode 3
              versionName '1.2'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            packaging { resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**'] } }
          }
          dependencies {
            implementation 'com.android.tools.build:apksig:8.5.2'
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <application android:label="محرر صور التطبيقات" android:icon="@android:drawable/ic_menu_gallery"
                android:theme="@android:style/Theme.Material.NoActionBar" android:supportsRtl="true"
                android:largeHeap="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".InstallReceiver" android:exported="false"/>
              <activity android:name=".ProjectActivity" android:exported="false" android:windowSoftInputMode="adjustResize"/>
            </application>
          </manifest>
          EOF
          cat > $J/U.java <<'EOF'
          package com.apkimg.editor;
          import android.app.*;
          import android.content.Context;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;

          public class U {
            public static final int BG = 0xFF0B1020, CARD = 0xFF141A2E, CARD2 = 0xFF1B2340, GOLD = 0xFFE9C46A, TXT = 0xFFEEF1F8, MUT = 0xFF8B93AD, RED = 0xFF4C1414, GRN = 0xFF14532D;
            public interface Progress { void set(String msg); }
            public interface Task { Object run(Progress p) throws Exception; }
            public interface Done { void ok(Object r); }

            public static int dp(Context c, float v) { return (int) (v * c.getResources().getDisplayMetrics().density); }
            public static GradientDrawable bg(Context c, int color, float r) {
              GradientDrawable g = new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp(c, r)); return g;
            }
            public static TextView tv(Context c, String t, float size, int color) {
              TextView v = new TextView(c); v.setText(t); v.setTextSize(size); v.setTextColor(color); return v;
            }
            public static Button btn(Context c, String t, int color, View.OnClickListener l) {
              Button b = new Button(c); b.setText(t); b.setAllCaps(false); b.setTextSize(15);
              b.setTextColor(color == GOLD ? 0xFF1A1300 : TXT); b.setBackground(bg(c, color, 14));
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(c, 52)); lp.setMargins(0, dp(c, 6), 0, 0);
              b.setLayoutParams(lp); b.setOnClickListener(l); return b;
            }
            public static void toast(Context c, String t) { Toast.makeText(c, t, Toast.LENGTH_LONG).show(); }
            public static void error(Activity a, Throwable e) {
              new AlertDialog.Builder(a).setTitle("صار خطأ").setMessage(String.valueOf(e.getMessage() != null ? e.getMessage() : e)).setPositiveButton("تمام", null).show();
            }
            /* يشغّل شغلة طويلة بالخلفية مع نافذة انتظار */
            public static void runBg(Activity a, String title, Task t, Done d) {
              LinearLayout l = new LinearLayout(a); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(a, 24), dp(a, 20), dp(a, 24), dp(a, 12));
              ProgressBar pb = new ProgressBar(a); l.addView(pb);
              TextView msg = tv(a, "...", 14, 0xFF333333); msg.setGravity(Gravity.CENTER); msg.setPadding(0, dp(a, 10), 0, 0); l.addView(msg);
              AlertDialog dlg = new AlertDialog.Builder(a).setTitle(title).setView(l).setCancelable(false).show();
              new Thread(() -> {
                Object r = null; Throwable err = null;
                try { r = t.run(m -> a.runOnUiThread(() -> msg.setText(m))); } catch (Throwable e) { err = e; }
                final Object rr = r; final Throwable ee = err;
                a.runOnUiThread(() -> {
                  try { dlg.dismiss(); } catch (Exception ignored) {}
                  if (ee != null) error(a, ee); else if (d != null) d.ok(rr);
                });
              }).start();
            }
          }
          EOF
          cat > $J/Apk.java <<'EOF'
          package com.apkimg.editor;
          import android.app.PendingIntent;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.android.apksig.ApkSigner;
          import java.io.*;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.security.cert.X509Certificate;
          import java.util.*;
          import java.util.zip.*;

          public class Apk {
            public static class Img {
              public String part, name; public long size; public boolean replaced;
              public String key() { return part.isEmpty() ? name : part + "::" + name; }
            }
            /* مشروع = الملف الأساسي base.apk + الملفات المقسّمة splits/*.apk */
            public static class Project {
              public final File dir; public final LinkedHashMap<String, ZipFile> parts = new LinkedHashMap<>();
              public Project(File dir) throws IOException {
                this.dir = dir;
                parts.put("", new ZipFile(base(dir)));
                File[] s = new File(dir, "splits").listFiles();
                if (s != null) { Arrays.sort(s); for (File f : s) if (f.getName().endsWith(".apk")) parts.put(f.getName().substring(0, f.getName().length() - 4), new ZipFile(f)); }
              }
              public File apkFile(String part) { return part.isEmpty() ? base(dir) : new File(dir, "splits/" + part + ".apk"); }
              public File repl(String part, String name) { return part.isEmpty() ? new File(dir, "repl/" + name) : new File(dir, "repl_s/" + part + "/" + name); }
              public ZipFile zip(String part) { return parts.get(part); }
              public void close() { for (ZipFile z : parts.values()) try { z.close(); } catch (Exception ignored) {} }
            }

            public static File root(Context c) { File f = new File(c.getFilesDir(), "projects"); f.mkdirs(); return f; }
            public static File base(File dir) { return new File(dir, "base.apk"); }
            public static int splitCount(File dir) { File[] s = new File(dir, "splits").listFiles(); return s == null ? 0 : s.length; }
            public static String readName(File dir) {
              try (BufferedReader r = new BufferedReader(new InputStreamReader(new FileInputStream(new File(dir, "name.txt")), "UTF-8"))) { return r.readLine(); }
              catch (Exception e) { return dir.getName(); }
            }
            public static void writeName(File dir, String n) throws IOException {
              try (OutputStream o = new FileOutputStream(new File(dir, "name.txt"))) { o.write(n.getBytes("UTF-8")); }
            }
            public static PackageInfo info(Context c, File apk) {
              PackageInfo pi = c.getPackageManager().getPackageArchiveInfo(apk.getAbsolutePath(), 0);
              if (pi != null && pi.applicationInfo != null) { pi.applicationInfo.sourceDir = apk.getAbsolutePath(); pi.applicationInfo.publicSourceDir = apk.getAbsolutePath(); }
              return pi;
            }
            public static Drawable icon(Context c, File apk) {
              try { PackageInfo pi = info(c, apk); return pi == null ? null : pi.applicationInfo.loadIcon(c.getPackageManager()); } catch (Exception e) { return null; }
            }
            public static void copy(InputStream in, OutputStream out) throws IOException {
              byte[] b = new byte[65536]; int n; while ((n = in.read(b)) > 0) out.write(b, 0, n);
            }
            static void copyFile(File a, File b) throws IOException {
              b.getParentFile().mkdirs();
              try (InputStream in = new FileInputStream(a); OutputStream o = new FileOutputStream(b)) { copy(in, o); }
            }
            public static int countRepl(File dir) { return countFiles(new File(dir, "repl")) + countFiles(new File(dir, "repl_s")); }
            static int countFiles(File f) {
              if (!f.exists()) return 0; if (f.isFile()) return 1;
              int n = 0; File[] k = f.listFiles(); if (k != null) for (File x : k) n += countFiles(x); return n;
            }
            public static void deleteRec(File f) {
              if (f.isDirectory()) { File[] k = f.listFiles(); if (k != null) for (File x : k) deleteRec(x); }
              f.delete();
            }
            static String nameOf(Context c, File baseApk, String fallback) {
              try { PackageInfo pi = info(c, baseApk); if (pi != null) return c.getPackageManager().getApplicationLabel(pi.applicationInfo).toString(); } catch (Exception ignored) {}
              return fallback == null ? "تطبيق" : fallback;
            }

            /* ---------- استيراد ---------- */
            static File newDir(Context c) { File d = new File(root(c), String.valueOf(System.currentTimeMillis())); d.mkdirs(); return d; }
            public static File importInstalled(Context c, ApplicationInfo a, String label, U.Progress p) throws Exception {
              File dir = newDir(c);
              p.set("نسخ الملف الأساسي...");
              copyFile(new File(a.sourceDir), base(dir));
              if (a.splitSourceDirs != null) for (String s : a.splitSourceDirs) {
                File f = new File(s); p.set("نسخ " + f.getName());
                copyFile(f, new File(dir, "splits/" + f.getName()));
              }
              writeName(dir, label);
              return dir;
            }
            /* ملف APK عادي، أو حزمة مقسّمة APKS / XAPK / APKM */
            public static File importStream(Context c, InputStream in, U.Progress p) throws Exception {
              File dir = newDir(c);
              File tmp = new File(dir, "incoming.zip");
              p.set("جاري نسخ الملف...");
              try (InputStream i = in; OutputStream o = new FileOutputStream(tmp)) {
                byte[] buf = new byte[65536]; int n; long tot = 0, last = 0;
                while ((n = i.read(buf)) > 0) { o.write(buf, 0, n); tot += n; if (tot - last > 2_000_000) { last = tot; p.set("انسخ " + (tot / 1_000_000) + " MB"); } }
              }
              try (ZipFile z = new ZipFile(tmp)) {
                if (z.getEntry("AndroidManifest.xml") != null) { z.close(); if (!tmp.renameTo(base(dir))) copyFile(tmp, base(dir)); }
                else {
                  List<ZipEntry> apks = new ArrayList<>();
                  for (ZipEntry e : Collections.list(z.entries())) if (!e.isDirectory() && e.getName().toLowerCase(Locale.ROOT).endsWith(".apk")) apks.add(e);
                  if (apks.isEmpty()) throw new Exception("هذا الملف مو APK ولا حزمة APKS");
                  ZipEntry baseE = null;
                  for (ZipEntry e : apks) { String s = e.getName().substring(e.getName().lastIndexOf('/') + 1); if (s.equals("base.apk")) baseE = e; }
                  if (baseE == null) for (ZipEntry e : apks) { String s = e.getName().substring(e.getName().lastIndexOf('/') + 1);
                    if (!s.startsWith("split_") && !s.startsWith("config.") && (baseE == null || e.getSize() > baseE.getSize())) baseE = e; }
                  if (baseE == null) baseE = apks.get(0);
                  for (ZipEntry e : apks) {
                    String s = e.getName().substring(e.getName().lastIndexOf('/') + 1);
                    File out = e == baseE ? base(dir) : new File(dir, "splits/" + s);
                    p.set("فك " + s); out.getParentFile().mkdirs();
                    try (InputStream is = z.getInputStream(e); OutputStream os = new FileOutputStream(out)) { copy(is, os); }
                  }
                }
              } catch (ZipException e) { deleteRec(dir); throw new Exception("هذا الملف مو APK صالح"); }
              tmp.delete();
              try (ZipFile z = new ZipFile(base(dir))) { if (z.getEntry("AndroidManifest.xml") == null) throw new Exception("ما لكيت الملف الأساسي"); }
              writeName(dir, nameOf(c, base(dir), "تطبيق"));
              return dir;
            }

            /* ---------- الصور ---------- */
            public static boolean isImage(String n) {
              String l = n.toLowerCase(Locale.ROOT);
              return l.endsWith(".png") || l.endsWith(".jpg") || l.endsWith(".jpeg") || l.endsWith(".webp");
            }
            public static boolean isNinePatch(String n) { return n.toLowerCase(Locale.ROOT).endsWith(".9.png"); }
            public static List<Img> list(Project pr) {
              List<Img> out = new ArrayList<>();
              for (Map.Entry<String, ZipFile> pe : pr.parts.entrySet()) {
                Set<String> seen = new HashSet<>();
                for (ZipEntry e : Collections.list(pe.getValue().entries())) {
                  if (e.isDirectory() || !isImage(e.getName()) || !seen.add(e.getName())) continue;
                  Img i = new Img(); i.part = pe.getKey(); i.name = e.getName(); i.size = e.getSize(); i.replaced = pr.repl(i.part, i.name).exists(); out.add(i);
                }
              }
              return out;
            }
            static int sample(int w, int h, int req) { int s = 1; while (w / (s * 2) >= req && h / (s * 2) >= req) s *= 2; return s; }
            public static Bitmap decode(Project pr, String part, String name, int req) {
              try {
                File r = pr.repl(part, name); ZipFile z = pr.zip(part);
                BitmapFactory.Options o = new BitmapFactory.Options(); o.inJustDecodeBounds = true;
                if (r.exists()) BitmapFactory.decodeFile(r.getAbsolutePath(), o);
                else try (InputStream in = z.getInputStream(z.getEntry(name))) { BitmapFactory.decodeStream(in, null, o); }
                if (o.outWidth <= 0) return null;
                BitmapFactory.Options o2 = new BitmapFactory.Options(); o2.inSampleSize = sample(o.outWidth, o.outHeight, req);
                if (r.exists()) return BitmapFactory.decodeFile(r.getAbsolutePath(), o2);
                try (InputStream in = z.getInputStream(z.getEntry(name))) { return BitmapFactory.decodeStream(in, null, o2); }
              } catch (Exception e) { return null; }
            }
            public static int[] dims(Project pr, String part, String name) {
              ZipFile z = pr.zip(part);
              try (InputStream in = z.getInputStream(z.getEntry(name))) {
                BitmapFactory.Options o = new BitmapFactory.Options(); o.inJustDecodeBounds = true;
                BitmapFactory.decodeStream(in, null, o); return new int[]{ o.outWidth, o.outHeight };
              } catch (Exception e) { return new int[]{ 0, 0 }; }
            }
            /* نفس الصورة بمقاسات ثانية (drawable-hdpi / drawable-xxhdpi ...) حتى لو بملفات مقسّمة ثانية */
            public static List<String[]> variants(Project pr, String part, String name, boolean all) {
              List<String[]> out = new ArrayList<>(); out.add(new String[]{ part, name });
              if (!all || !name.startsWith("res/") || name.lastIndexOf('/') < 4) return out;
              String file = name.substring(name.lastIndexOf('/') + 1);
              String folder = name.substring(4, name.lastIndexOf('/'));
              String kind = folder.contains("-") ? folder.substring(0, folder.indexOf('-')) : folder;
              for (Map.Entry<String, ZipFile> pe : pr.parts.entrySet())
                for (ZipEntry e : Collections.list(pe.getValue().entries())) {
                  String n = e.getName();
                  if ((pe.getKey().equals(part) && n.equals(name)) || !n.startsWith("res/" + kind) || !n.endsWith("/" + file)) continue;
                  String f2 = n.substring(4, n.lastIndexOf('/'));
                  if (f2.equals(kind) || f2.startsWith(kind + "-")) out.add(new String[]{ pe.getKey(), n });
                }
              return out;
            }
            static String key(String part, String name) { return part.isEmpty() ? name : part + "::" + name; }
            static Bitmap fit(Bitmap src, int w, int h) {
              float s = Math.max((float) w / src.getWidth(), (float) h / src.getHeight());
              int sw = Math.round(w / s), sh = Math.round(h / s);
              int x = Math.max(0, (src.getWidth() - sw) / 2), y = Math.max(0, (src.getHeight() - sh) / 2);
              Bitmap crop = Bitmap.createBitmap(src, x, y, Math.min(sw, src.getWidth() - x), Math.min(sh, src.getHeight() - y));
              return Bitmap.createScaledBitmap(crop, w, h, true);
            }
            @SuppressWarnings("deprecation")
            static void encode(Bitmap b, String name, File out) throws IOException {
              out.getParentFile().mkdirs();
              String l = name.toLowerCase(Locale.ROOT);
              Bitmap.CompressFormat f; int q = 100;
              if (l.endsWith(".jpg") || l.endsWith(".jpeg")) { f = Bitmap.CompressFormat.JPEG; q = 92; }
              else if (l.endsWith(".webp")) { if (Build.VERSION.SDK_INT >= 30) f = Bitmap.CompressFormat.WEBP_LOSSY; else f = Bitmap.CompressFormat.WEBP; q = 90; }
              else f = Bitmap.CompressFormat.PNG;
              try (OutputStream o = new FileOutputStream(out)) { if (!b.compress(f, q, o)) throw new IOException("ما كدرت أحفظ الصورة"); }
            }
            /* ---------- تحديد الصور المشابهة (بصمة الصورة) ---------- */
            static File hashFile(Project pr) { return new File(pr.dir, "hashes.txt"); }
            static Map<String, long[]> loadHashes(Project pr) {
              Map<String, long[]> m = new HashMap<>();
              try (BufferedReader r = new BufferedReader(new InputStreamReader(new FileInputStream(hashFile(pr)), "UTF-8"))) {
                String l; while ((l = r.readLine()) != null) { String[] a = l.split("\t"); if (a.length == 4) m.put(a[0], new long[]{ Long.parseLong(a[1]), Long.parseLong(a[2]), Long.parseLong(a[3]) }); }
              } catch (Exception ignored) {}
              return m;
            }
            static void saveHashes(Project pr, Map<String, long[]> m) {
              try (Writer w = new OutputStreamWriter(new FileOutputStream(hashFile(pr)), "UTF-8")) {
                for (Map.Entry<String, long[]> e : m.entrySet()) w.write(e.getKey() + "\t" + e.getValue()[0] + "\t" + e.getValue()[1] + "\t" + e.getValue()[2] + "\n");
              } catch (Exception ignored) {}
            }
            /* بصمة الصورة الأصلية: 64 بت (dHash) على خلفية رمادية حتى الشكل الشفاف يحسب */
            static long[] fingerprint(Project pr, String part, String name) {
              ZipFile z = pr.zip(part);
              try {
                BitmapFactory.Options o = new BitmapFactory.Options(); o.inJustDecodeBounds = true;
                try (InputStream in = z.getInputStream(z.getEntry(name))) { BitmapFactory.decodeStream(in, null, o); }
                if (o.outWidth <= 0) return null;
                BitmapFactory.Options o2 = new BitmapFactory.Options(); o2.inSampleSize = sample(o.outWidth, o.outHeight, 32);
                Bitmap b; try (InputStream in = z.getInputStream(z.getEntry(name))) { b = BitmapFactory.decodeStream(in, null, o2); }
                if (b == null) return null;
                Bitmap g = Bitmap.createBitmap(9, 8, Bitmap.Config.ARGB_8888);
                Canvas cv = new Canvas(g); cv.drawColor(0xFF808080);
                cv.drawBitmap(b, null, new Rect(0, 0, 9, 8), new Paint(Paint.FILTER_BITMAP_FLAG));
                int[] px = new int[72]; g.getPixels(px, 0, 9, 0, 0, 9, 8);
                long h = 0; int bit = 0;
                for (int y = 0; y < 8; y++) for (int x = 0; x < 8; x++) {
                  if (lum(px[y * 9 + x]) > lum(px[y * 9 + x + 1])) h |= (1L << bit);
                  bit++;
                }
                return new long[]{ h, o.outWidth, o.outHeight };
              } catch (Exception e) { return null; }
            }
            static int lum(int c) { return ((c >> 16) & 255) * 3 + ((c >> 8) & 255) * 6 + (c & 255); }
            public static List<String[]> similar(Project pr, String part, String name, U.Progress p) {
              List<Img> imgs = list(pr);
              Map<String, long[]> hs = loadHashes(pr); boolean changed = false; int i = 0;
              for (Img im : imgs) {
                i++;
                if (!hs.containsKey(im.key())) {
                  if (i % 25 == 0) p.set("أدور على الصور المشابهة " + i + " / " + imgs.size());
                  long[] f = fingerprint(pr, im.part, im.name); hs.put(im.key(), f == null ? new long[]{ 0, 0, 0 } : f); changed = true;
                }
              }
              if (changed) saveHashes(pr, hs);
              long[] t = hs.get(key(part, name));
              LinkedHashMap<String, String[]> out = new LinkedHashMap<>();
              for (String[] v : variants(pr, part, name, true)) out.put(key(v[0], v[1]), v);
              if (t != null && t[1] > 0) {
                double a0 = (double) t[1] / t[2];
                for (Img im : imgs) {
                  long[] f = hs.get(im.key()); if (f == null || f[1] <= 0) continue;
                  double a = (double) f[1] / f[2];
                  if (Math.abs(a - a0) / a0 > 0.12) continue;
                  if (Long.bitCount(f[0] ^ t[0]) <= 5) out.put(im.key(), new String[]{ im.part, im.name });
                }
              }
              return new ArrayList<>(out.values());
            }

            /* ---------- وضع الصورة الجديدة بنفس مكان وحجم الرسمة الأصلية ---------- */
            static Rect alphaBox(Bitmap b) {
              if (!b.hasAlpha()) return null;
              int w = b.getWidth(), h = b.getHeight(), minX = w, minY = h, maxX = -1, maxY = -1;
              int[] row = new int[w];
              for (int y = 0; y < h; y++) {
                b.getPixels(row, 0, w, 0, y, w, 1);
                for (int x = 0; x < w; x++) if ((row[x] >>> 24) > 12) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
              }
              if (maxX < 0) return null;
              if (minX == 0 && minY == 0 && maxX == w - 1 && maxY == h - 1) {
                int[] c = new int[4]; c[0] = b.getPixel(0, 0); c[1] = b.getPixel(w - 1, 0); c[2] = b.getPixel(0, h - 1); c[3] = b.getPixel(w - 1, h - 1);
                boolean opaqueCorners = true; for (int k : c) if ((k >>> 24) < 250) opaqueCorners = false;
                if (opaqueCorners) return null;
              }
              return new Rect(minX, minY, maxX + 1, maxY + 1);
            }
            static Bitmap place(Bitmap neu, Bitmap orig) {
              int w = orig.getWidth(), h = orig.getHeight();
              Rect box = alphaBox(orig);
              if (box == null) return fit(neu, w, h);            /* صورة كاملة (خلفية): تملي نفس الحجم */
              Rect src = alphaBox(neu); if (src == null) src = new Rect(0, 0, neu.getWidth(), neu.getHeight());
              float s = Math.min((float) box.width() / src.width(), (float) box.height() / src.height());
              int dw = Math.max(1, Math.round(src.width() * s)), dh = Math.max(1, Math.round(src.height() * s));
              int dx = box.left + (box.width() - dw) / 2, dy = box.bottom - dh;  /* بالنص، وقاعدتها على نفس خط الأصلية */
              Bitmap out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
              new Canvas(out).drawBitmap(neu, src, new Rect(dx, dy, dx + dw, dy + dh), new Paint(Paint.FILTER_BITMAP_FLAG | Paint.ANTI_ALIAS_FLAG));
              return out;
            }
            static Bitmap original(Project pr, String part, String name) {
              ZipFile z = pr.zip(part);
              try (InputStream in = z.getInputStream(z.getEntry(name))) {
                BitmapFactory.Options o = new BitmapFactory.Options(); o.inPreferredConfig = Bitmap.Config.ARGB_8888;
                return BitmapFactory.decodeStream(in, null, o);
              } catch (Exception e) { return null; }
            }
            public static List<String> replace(Context c, Project pr, List<String[]> targets, Uri src, U.Progress p) throws Exception {
              BitmapFactory.Options o = new BitmapFactory.Options(); o.inJustDecodeBounds = true;
              try (InputStream in = c.getContentResolver().openInputStream(src)) { BitmapFactory.decodeStream(in, null, o); }
              if (o.outWidth <= 0) throw new Exception("الصورة المختارة ما تنفتح");
              BitmapFactory.Options o2 = new BitmapFactory.Options(); o2.inSampleSize = sample(o.outWidth, o.outHeight, 2048); o2.inPreferredConfig = Bitmap.Config.ARGB_8888;
              Bitmap img;
              try (InputStream in = c.getContentResolver().openInputStream(src)) { img = BitmapFactory.decodeStream(in, null, o2); }
              if (img == null) throw new Exception("الصورة المختارة ما تنفتح");
              List<String> keys = new ArrayList<>(); int i = 0;
              for (String[] t : targets) {
                i++; p.set("تغيير " + i + " / " + targets.size());
                Bitmap orig = original(pr, t[0], t[1]);
                Bitmap outB = orig == null ? img : place(img, orig);
                encode(outB, t[1], pr.repl(t[0], t[1])); keys.add(key(t[0], t[1]));
              }
              return keys;
            }
            public static List<String> restoreTargets(Project pr, List<String[]> targets) {
              List<String> keys = new ArrayList<>();
              for (String[] t : targets) { pr.repl(t[0], t[1]).delete(); keys.add(key(t[0], t[1])); }
              return keys;
            }


            /* ---------- إعادة البناء والتوقيع ---------- */
            public static class Result { public List<File> apks = new ArrayList<>(); public Uri download; public String fileName; }
            static boolean isSignatureFile(String n) {
              if (n.equals("stamp-cert-sha256")) return true;
              if (!n.startsWith("META-INF/")) return false;
              String u = n.toUpperCase(Locale.ROOT);
              return u.equals("META-INF/MANIFEST.MF") || u.endsWith(".SF") || u.endsWith(".RSA") || u.endsWith(".DSA") || u.endsWith(".EC");
            }
            static void buildUnsigned(Project pr, String part, File out, U.Progress p, String label) throws Exception {
              ZipFile z = pr.zip(part);
              try (ZipOutputStream zo = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(out), 1 << 16))) {
                List<? extends ZipEntry> all = Collections.list(z.entries());
                Set<String> seen = new HashSet<>(); int i = 0;
                for (ZipEntry e : all) {
                  i++; if (i % 50 == 0) p.set(label + " " + i + " / " + all.size());
                  String n = e.getName();
                  if (e.isDirectory() || isSignatureFile(n) || !seen.add(n)) continue;
                  File r = pr.repl(part, n);
                  ZipEntry ne = new ZipEntry(n);
                  if (e.getTime() > 0) ne.setTime(e.getTime());
                  if (e.getMethod() == ZipEntry.STORED) {
                    ne.setMethod(ZipEntry.STORED);
                    if (r.exists()) {
                      CRC32 crc = new CRC32();
                      try (InputStream in = new FileInputStream(r)) { byte[] b = new byte[65536]; int k; while ((k = in.read(b)) > 0) crc.update(b, 0, k); }
                      ne.setSize(r.length()); ne.setCompressedSize(r.length()); ne.setCrc(crc.getValue());
                    } else { ne.setSize(e.getSize()); ne.setCompressedSize(e.getSize()); ne.setCrc(e.getCrc()); }
                  } else ne.setMethod(ZipEntry.DEFLATED);
                  zo.putNextEntry(ne);
                  try (InputStream in = r.exists() ? new FileInputStream(r) : z.getInputStream(e)) { copy(in, zo); }
                  zo.closeEntry();
                }
              }
            }
            static void sign(Context c, File in, File out) throws Exception {
              char[] pass = "apkimg123".toCharArray();
              KeyStore ks = KeyStore.getInstance("PKCS12");
              try (InputStream is = c.getAssets().open("sign.p12")) { ks.load(is, pass); }
              PrivateKey pk = (PrivateKey) ks.getKey("mod", pass);
              X509Certificate cert = (X509Certificate) ks.getCertificate("mod");
              ApkSigner.SignerConfig sc = new ApkSigner.SignerConfig.Builder("MOD", pk, Collections.singletonList(cert)).build();
              new ApkSigner.Builder(Collections.singletonList(sc))
                .setInputApk(in).setOutputApk(out)
                .setV1SigningEnabled(true).setV2SigningEnabled(true).setV3SigningEnabled(false)
                .build().sign();
            }
            public static Result rebuild(Context c, Project pr, U.Progress p) throws Exception {
              File outDir = new File(c.getExternalFilesDir(null), "out"); deleteRec(outDir); outDir.mkdirs();
              File tmp = new File(c.getCacheDir(), "unsigned.apk");
              Result res = new Result();
              int k = 0, n = pr.parts.size();
              for (String part : pr.parts.keySet()) {
                k++;
                String fname = part.isEmpty() ? "base.apk" : part + ".apk";
                String label = n > 1 ? "بناء الملف " + k + " من " + n : "جاري البناء";
                tmp.delete(); buildUnsigned(pr, part, tmp, p, label);
                p.set(label + " · توقيع...");
                File signed = new File(outDir, fname); sign(c, tmp, signed); res.apks.add(signed);
              }
              tmp.delete();
              p.set("جاري الحفظ بالتنزيلات...");
              String nm = readName(pr.dir).replaceAll("[\\\\/:*?\"<>|]", "_") + "_mod_" + (System.currentTimeMillis() / 1000 % 100000);
              if (res.apks.size() == 1) {
                res.fileName = nm + ".apk";
                res.download = saveToDownloads(c, res.apks.get(0), res.fileName, "application/vnd.android.package-archive");
              } else {
                File bundle = new File(c.getCacheDir(), "bundle.apks");
                try (ZipOutputStream zo = new ZipOutputStream(new FileOutputStream(bundle))) {
                  for (File f : res.apks) {
                    ZipEntry e = new ZipEntry(f.getName()); e.setMethod(ZipEntry.STORED);
                    CRC32 crc = new CRC32();
                    try (InputStream in = new FileInputStream(f)) { byte[] b = new byte[65536]; int r; while ((r = in.read(b)) > 0) crc.update(b, 0, r); }
                    e.setSize(f.length()); e.setCompressedSize(f.length()); e.setCrc(crc.getValue());
                    zo.putNextEntry(e); try (InputStream in = new FileInputStream(f)) { copy(in, zo); } zo.closeEntry();
                  }
                }
                res.fileName = nm + ".apks";
                res.download = saveToDownloads(c, bundle, res.fileName, "application/octet-stream");
                bundle.delete();
              }
              return res;
            }

            /* ---------- التثبيت (يدعم الملفات المقسّمة) ---------- */
            public static void install(Context c, List<File> apks) throws Exception {
              PackageInstaller pi = c.getPackageManager().getPackageInstaller();
              PackageInstaller.SessionParams params = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
              int id = pi.createSession(params);
              try (PackageInstaller.Session s = pi.openSession(id)) {
                for (File f : apks) {
                  try (InputStream in = new FileInputStream(f); OutputStream o = s.openWrite(f.getName(), 0, f.length())) { copy(in, o); s.fsync(o); }
                }
                Intent cb = new Intent(c, InstallReceiver.class);
                int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE : PendingIntent.FLAG_UPDATE_CURRENT;
                PendingIntent p = PendingIntent.getBroadcast(c, id, cb, flags);
                s.commit(p.getIntentSender());
              }
            }

            public static Uri saveToDownloads(Context c, File f, String name, String mime) throws Exception {
              try (InputStream in = new FileInputStream(f)) { return saveToDownloads(c, in, name, mime); }
            }
            public static Uri saveToDownloads(Context c, InputStream in, String name, String mime) throws Exception {
              ContentValues v = new ContentValues();
              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
              Uri u = c.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
              if (u == null) throw new Exception("ما كدرت أكتب بمجلد التنزيلات");
              try (OutputStream o = c.getContentResolver().openOutputStream(u)) { copy(in, o); }
              return u;
            }
          }
